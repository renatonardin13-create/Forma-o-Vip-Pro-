<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Background Canvas Gradients -->
    <radialGradient id="bgCenterGlow" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#241B12" />
      <stop offset="35%" stop-color="#14110E" />
      <stop offset="70%" stop-color="#0A0B0E" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    <linearGradient id="overlayDarkLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08090C" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#08090C" stop-opacity="0.80" />
      <stop offset="65%" stop-color="#08090C" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#08090C" stop-opacity="0.75" />
    </linearGradient>

    <!-- Golden Lighting Elements -->
    <linearGradient id="goldBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#E6A23C" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#E6A23C" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="haloGolden" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C065" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#E6A23C" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#E6A23C" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#E6A23C" stop-opacity="0" />
    </radialGradient>

    <!-- Book Materials -->
    <linearGradient id="bookCoverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE19F" />
      <stop offset="30%" stop-color="#E6A23C" />
      <stop offset="70%" stop-color="#A66814" />
      <stop offset="100%" stop-color="#472A05" />
    </linearGradient>
    <linearGradient id="bookCoverObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3342" />
      <stop offset="40%" stop-color="#181B24" />
      <stop offset="100%" stop-color="#0D0E13" />
    </linearGradient>
    <linearGradient id="bookSpineGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A8" />
      <stop offset="50%" stop-color="#E6A23C" />
      <stop offset="100%" stop-color="#7A4B0A" />
    </linearGradient>
    <linearGradient id="pageEdges" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Floor Reflection Gradient -->
    <linearGradient id="floorReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6A23C" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#0A0B0E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050608" stop-opacity="1" />
    </linearGradient>

    <!-- Blur & Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cinematicBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Base Infinite Library Space -->
  <rect x="0" y="0" width="1920" height="600" fill="url(#bgCenterGlow)" />

  <!-- Receding Perspective Grid / Knowledge Vault Lines -->
  <g stroke="#E6A23C" stroke-opacity="0.07" stroke-width="1.5">
    <line x1="960" y1="200" x2="0" y2="600" />
    <line x1="960" y1="200" x2="350" y2="600" />
    <line x1="960" y1="200" x2="700" y2="600" />
    <line x1="960" y1="200" x2="1050" y2="600" />
    <line x1="960" y1="200" x2="1400" y2="600" />
    <line x1="960" y1="200" x2="1750" y2="600" />
    <line x1="960" y1="200" x2="1920" y2="520" />
    <!-- Horizontal Perspective Shelving Ribs -->
    <line x1="720" y1="300" x2="1200" y2="300" stroke-opacity="0.1" />
    <line x1="580" y1="380" x2="1340" y2="380" stroke-opacity="0.08" />
    <line x1="380" y1="460" x2="1540" y2="460" stroke-opacity="0.06" />
  </g>

  <!-- Architectural Background Pillars / Book Archive Stacks (Right/Deep Center) -->
  <g opacity="0.35">
    <rect x="1100" y="80" width="30" height="340" rx="3" fill="#181C26" stroke="#252C3D" stroke-width="1" />
    <rect x="1140" y="60" width="28" height="360" rx="3" fill="#141720" />
    <rect x="1176" y="90" width="32" height="330" rx="3" fill="#181C26" />
    <rect x="1218" y="70" width="30" height="350" rx="3" fill="#1B1F2A" />
    <rect x="1258" y="100" width="34" height="320" rx="3" fill="#151822" />

    <!-- Distant Spines in Gold/Graphite -->
    <line x1="1115" y1="120" x2="1115" y2="180" stroke="#E6A23C" stroke-width="2" stroke-opacity="0.6" />
    <line x1="1192" y1="140" x2="1192" y2="210" stroke="#E6A23C" stroke-width="2" stroke-opacity="0.6" />
    <line x1="1233" y1="130" x2="1233" y2="190" stroke="#F5D76E" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Volumetric Cinema Light Rays From Top Ceiling -->
  <polygon points="1350,0 1480,0 1780,600 1520,600" fill="url(#goldBeamGrad)" />
  <polygon points="1200,0 1280,0 1420,600 1260,600" fill="url(#goldBeamGrad)" opacity="0.6" />

  <!-- Ambient Light Sphere in Knowledge Core -->
  <circle cx="1450" cy="280" r="280" fill="url(#haloGolden)" filter="url(#softGlow)" />

  <!-- Hero Book Composition on the Right Side (Elegantly angled hardcover e-books) -->
  <g transform="translate(1220, 160)">
    <!-- Standing Volume 1 (Obsidian with Gold Trim) -->
    <g transform="translate(180, 40) rotate(12)">
      <!-- Back cover shadow -->
      <polygon points="0,0 120,-30 120,240 0,270" fill="#090B0E" filter="url(#cinematicBlur)" />
      <!-- Book Body -->
      <polygon points="0,0 110,-26 110,230 0,256" fill="url(#bookCoverObsidian)" stroke="#384259" stroke-width="2" />
      <!-- Page thickness -->
      <polygon points="110,-26 124,-22 124,234 110,230" fill="url(#pageEdges)" />
      <!-- Gold Embossed Geometric Pattern on Cover -->
      <polygon points="25,30 85,15 85,190 25,205" fill="none" stroke="#E6A23C" stroke-width="2" stroke-opacity="0.75" />
      <polygon points="35,50 75,40 75,170 35,180" fill="none" stroke="#E6A23C" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="55" cy="110" r="16" fill="none" stroke="#E6A23C" stroke-width="2" stroke-opacity="0.8" />
    </g>

    <!-- Standing Volume 2 (Master Gold Executive Hardcover) -->
    <g transform="translate(80, 20) rotate(-6)">
      <!-- Spine -->
      <rect x="0" y="0" width="36" height="280" rx="4" fill="url(#bookSpineGold)" stroke="#FFF3D1" stroke-width="1" />
      <!-- Spine Details -->
      <line x1="6" y1="30" x2="30" y2="30" stroke="#FFF3D1" stroke-width="2" />
      <line x1="6" y1="36" x2="30" y2="36" stroke="#523106" stroke-width="1" />
      <line x1="6" y1="240" x2="30" y2="240" stroke="#FFF3D1" stroke-width="2" />
      <polygon points="18,120 26,132 18,144 10,132" fill="#FFF3D1" />
      
      <!-- Front Perspective -->
      <polygon points="36,2 170,-28 170,252 36,282" fill="url(#bookCoverGold)" stroke="#FFF5DB" stroke-width="1.5" />
      <!-- Pages -->
      <polygon points="170,-28 186,-24 186,256 170,252" fill="url(#pageEdges)" />
      <!-- Cover Embellishment -->
      <circle cx="102" cy="112" r="28" fill="none" stroke="#FFF5DB" stroke-width="2" stroke-opacity="0.85" />
      <polygon points="102,96 112,112 102,128 92,112" fill="#FFF5DB" />
    </g>

    <!-- Resting / Angled Volume 3 (Foundation Guide) -->
    <g transform="translate(-20, 160) rotate(-22)">
      <polygon points="0,0 140,-35 140,190 0,225" fill="url(#bookCoverObsidian)" stroke="#E6A23C" stroke-width="2" />
      <polygon points="140,-35 152,-32 152,193 140,190" fill="url(#pageEdges)" />
      <line x1="20" y1="30" x2="120" y2="5" stroke="#E6A23C" stroke-width="1.5" stroke-opacity="0.6" />
      <line x1="20" y1="45" x2="100" y2="25" stroke="#E6A23C" stroke-width="1" stroke-opacity="0.4" />
    </g>

    <!-- Floating Luminous Data Nodes / Golden Bokeh -->
    <circle cx="60" cy="-20" r="4" fill="#FFF5DB" filter="url(#softGlow)" />
    <circle cx="210" cy="10" r="3" fill="#E6A23C" />
    <circle cx="280" cy="90" r="5" fill="#F5C065" opacity="0.8" />
    <circle cx="140" cy="270" r="3" fill="#FFF" opacity="0.7" />
    <circle cx="-40" cy="80" r="4" fill="#E6A23C" opacity="0.6" />
    <circle cx="340" cy="200" r="2" fill="#FFF5DB" />
  </g>

  <!-- Dark Luxurious Floor Horizon & Subtle Amber Reflection -->
  <rect x="0" y="470" width="1920" height="130" fill="url(#floorReflection)" />
  <line x1="0" y1="470" x2="1920" y2="470" stroke="#E6A23C" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Left Negative Space Gradient Mask (Keeps Left 55% Pristine for Typography & Buttons) -->
  <rect x="0" y="0" width="1920" height="600" fill="url(#overlayDarkLeft)" />

  <!-- Subtle Left Accent Line -->
  <line x1="60" y1="120" x2="60" y2="480" stroke="#E6A23C" stroke-width="2" stroke-opacity="0.25" />
</svg>
