<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="logoGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB" />
      <stop offset="25%" stop-color="#F7D085" />
      <stop offset="60%" stop-color="#E6A23C" />
      <stop offset="100%" stop-color="#B8771A" />
    </linearGradient>
    <linearGradient id="logoGoldDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C5A14" />
      <stop offset="50%" stop-color="#C78722" />
      <stop offset="100%" stop-color="#FBE6B3" />
    </linearGradient>
    <linearGradient id="textWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="iconAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6A23C" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#E6A23C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#E6A23C" stop-opacity="0" />
    </radialGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E6A23C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Icon Container & Ambient Glow -->
  <g transform="translate(30, 20)">
    <circle cx="80" cy="80" r="76" fill="url(#iconAura)" />
    
    <!-- Stylized Open Book Symbol -->
    <g filter="url(#logoShadow)">
      <!-- Back Page Layers -->
      <path d="M 80 120 C 72 112 50 106 20 108 L 26 58 C 50 56 68 62 80 72 C 92 62 110 56 134 58 L 140 108 C 110 106 88 112 80 120 Z" 
            fill="url(#logoGoldDark)" opacity="0.65" />
      
      <!-- Main Left Page Wing -->
      <path d="M 80 120 C 70 110 46 102 14 104 L 22 46 C 46 44 68 52 80 62 Z" 
            fill="url(#logoGoldLight)" />
      
      <!-- Main Right Page Wing -->
      <path d="M 80 120 C 90 110 114 102 146 104 L 138 46 C 114 44 92 52 80 62 Z" 
            fill="url(#logoGoldLight)" />

      <!-- Page Texture Lines -->
      <path d="M 32 64 C 48 64 64 70 74 78" stroke="#8C5A14" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 30 80 C 46 80 64 86 74 94" stroke="#8C5A14" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 128 64 C 112 64 96 70 86 78" stroke="#8C5A14" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M 130 80 C 114 80 96 86 86 94" stroke="#8C5A14" stroke-width="2.5" stroke-linecap="round" fill="none" />

      <!-- Star / Diamond Spark of Knowledge -->
      <polygon points="80,24 84,34 94,36 86,44 88,54 80,48 72,54 74,44 66,36 76,34" fill="url(#logoGoldLight)" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(205, 35)">
    <!-- Top Superline: FORMAÇÃO VIP PRO -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#logoGoldLight)">
      FORMAÇÃO VIP PRO
    </text>

    <!-- Sleek Decorative Separator -->
    <line x1="2" y1="62" x2="520" y2="62" stroke="#E6A23C" stroke-width="2" stroke-opacity="0.4" />
    <polygon points="260,59 265,62 260,65 255,62" fill="#E6A23C" />

    <!-- Main Subject Line: E-BOOKS (PDF) -->
    <text x="0" y="108" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="40" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#textWhite)">
      E-BOOKS <tspan fill="url(#logoGoldLight)">(PDF)</tspan>
    </text>

    <!-- Subtitle Pill / Badge -->
    <g transform="translate(370, 78)">
      <rect x="0" y="0" width="168" height="28" rx="6" fill="#1A1612" stroke="#E6A23C" stroke-width="1.5" />
      <text x="84" y="18" 
            text-anchor="middle"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="11" 
            font-weight="800" 
            letter-spacing="1.5" 
            fill="#E6A23C">
        BIBLIOTECA VIP
      </text>
    </g>
  </g>
</svg>
